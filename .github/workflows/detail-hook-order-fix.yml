name: One-time detail hook order fix

on:
  push:
    branches: [chatgpt-production-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time detail hook order fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-production-hardening

      - name: Fix React hook ordering in detail modals
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename, anchor in [
            ('src/components/HallDetailsModal.tsx', '  const isSelfHall ='),
            ('src/components/ServiceProviderDetailsModal.tsx', '  const isSelfProvider ='),
          ]:
            p = Path(filename)
            s = p.read_text()
            guard = "  if (!isOpen || !hall) return null;\n\n" if 'Hall' in filename else "  if (!isOpen || !provider) return null;\n\n"
            if guard not in s:
              raise SystemExit(f'Guard missing in {filename}')
            s = s.replace(guard, '', 1)
            if anchor not in s:
              raise SystemExit(f'Anchor missing in {filename}')
            s = s.replace(anchor, guard + anchor, 1)
            p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HallDetailsModal.tsx src/components/ServiceProviderDetailsModal.tsx
          git commit -m "Fix React hook order in detail modals"
          git push origin HEAD:chatgpt-production-hardening
