name: One-time source autofix

on:
  push:
    branches: [chatgpt-production-hardening]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message == 'Add one-time source autofix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-production-hardening

      - name: Patch source safely
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          old = """  const handleChangeAccountType = async (newType: AccountType) => {\n    const updatedProfile: UserProfile = {\n      ...currentUser,\n      accountType: newType,\n    };\n\n    if (newType === 'صاحب قاعة') {\n      updatedProfile.ownedHallId = 'hall-1';\n    } else if (newType === 'مزود خدمة') {\n      updatedProfile.ownedProviderId = 'provider-1';\n    }\n\n    setCurrentUser(updatedProfile);\n    await saveUserToFirestore(updatedProfile);\n  };\n\n"""
          if old not in text:
              raise SystemExit('Expected insecure role-switch handler not found')
          text = text.replace(old, '')
          text = text.replace("            isAdmin={currentUser.accountType === 'مدير Admin' || currentUser.accountType === 'مدير'}", "            isAdmin={false}")
          text = text.replace("        onChangeAccountType={handleChangeAccountType}\n", "")
          text = text.replace("        onOpenBookingModal={(hall) => {", "        onBookHall={(hall) => {")
          text = text.replace("        onOpenBookingModal={(provider) => {", "        onBookProvider={(provider) => {")
          text = text.replace("        onToggleFavorite={() => selectedHallForModal && handleToggleFavorite(selectedHallForModal.id, 'hall')}\n        onBookHall=", "        onToggleFavorite={() => selectedHallForModal && handleToggleFavorite(selectedHallForModal.id, 'hall')}\n        currentUser={currentUser}\n        bookings={bookings}\n        onBookHall=")
          text = text.replace("        onToggleFavorite={() => selectedProviderForModal && handleToggleFavorite(selectedProviderForModal.id, 'provider')}\n        onBookProvider=", "        onToggleFavorite={() => selectedProviderForModal && handleToggleFavorite(selectedProviderForModal.id, 'provider')}\n        currentUser={currentUser}\n        bookings={bookings}\n        onBookProvider=")
          app.write_text(text)

          card = Path('src/components/ServiceProviderCard.tsx')
          text = card.read_text()
          old = '<CheckCircle2 className="w-3.5 h-3.5 text-emerald-600 fill-emerald-100 shrink-0" title="موثق" />'
          new = '<span title="موثق"><CheckCircle2 className="w-3.5 h-3.5 text-emerald-600 fill-emerald-100 shrink-0" /></span>'
          if old not in text:
              raise SystemExit('Expected verified icon markup not found')
          card.write_text(text.replace(old, new))
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ServiceProviderCard.tsx
          git commit -m "Fix app wiring and remaining TypeScript errors"
          git push origin HEAD:chatgpt-production-hardening
