name: One-time role routing fix

on:
  push:
    branches: [chatgpt-production-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time role routing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-production-hardening

      - name: Patch owner/provider routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("if (currentUser.accountType === 'صاحب قاعة') {", "if (currentUser.accountType === 'صاحب قاعة' && currentTab === 'home') {", 1)
          s = s.replace("if (currentUser.accountType === 'مزود خدمة') {", "if (currentUser.accountType === 'مزود خدمة' && currentTab === 'home') {", 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Allow owners and providers to use shared app tabs"
          git push origin HEAD:chatgpt-production-hardening
