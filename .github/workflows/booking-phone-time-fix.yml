name: One-time booking phone and time selector fix

on:
  push:
    branches: [chatgpt-production-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time booking phone and time selector fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-production-hardening

      - name: Patch Iraqi phone inputs and booking time UX
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- AuthModal: digits only, max 11 ----------
          p = Path('src/components/AuthModal.tsx')
          s = p.read_text()
          old = '<input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="07701234567" className="w-full pr-9 pl-3 py-2 rounded-xl border text-xs dir-ltr text-left" required />'
          new = '<input type="tel" inputMode="numeric" maxLength={11} value={phone} onChange={(e) => setPhone(toEnglishDigits(e.target.value).replace(/\\D/g, \'\').slice(0, 11))} placeholder="07701234567" className="w-full pr-9 pl-3 py-2 rounded-xl border text-xs dir-ltr text-left" required />'
          if old not in s:
            raise SystemExit('Auth phone input marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- BookingModal ----------
          p = Path('src/components/BookingModal.tsx')
          s = p.read_text()

          # Replace fixed slots model with period + from/to model.
          start = s.index("type Slot =")
          end = s.index("function toEnglishDigits")
          replacement = '''type PeriodKey = 'morning' | 'evening' | 'night';
          type Period = { key: PeriodKey; label: string; start: number; end: number };
          const PERIODS: Period[] = [
            { key: 'morning', label: 'صباحي', start: 10, end: 14 },
            { key: 'evening', label: 'مسائي', start: 18, end: 23 },
            { key: 'night', label: 'ليلي', start: 23, end: 26 },
          ];

          function hourToTime(hour: number): string {
            const normalized = hour % 24;
            return `${String(normalized).padStart(2, '0')}:00`;
          }

          function hourLabel(hour: number): string {
            const h = hour % 24;
            const suffix = h < 12 ? 'ص' : 'م';
            const display = h % 12 || 12;
            return `${display}:00 ${suffix}`;
          }

          function minutesForRange(startTime: string, endTime: string): number[] {
            const toMinutes = (time: string) => { const [h, m] = time.split(':').map(Number); return h * 60 + m; };
            const start = toMinutes(startTime);
            let end = toMinutes(endTime);
            if (end <= start) end += 1440;
            const result: number[] = [];
            for (let minute = Math.floor(start / 30) * 30; minute < end; minute += 30) result.push(minute);
            return result;
          }

          '''
          s = s[:start] + replacement + s[end:]

          # Remove old minutesForSlot helper.
          helper_start = s.find('function minutesForSlot(')
          if helper_start >= 0:
            helper_end = s.find('\n}\n\nexport const BookingModal', helper_start)
            if helper_end < 0:
              raise SystemExit('minutesForSlot end not found')
            s = s[:helper_start] + s[helper_end+3:]

          s = s.replace("  const [timeSlot, setTimeSlot] = useState(SLOTS[1].label);", "  const [selectedPeriod, setSelectedPeriod] = useState<PeriodKey>('evening');\n  const [startTime, setStartTime] = useState('18:00');\n  const [endTime, setEndTime] = useState('23:00');")

          old_block = "  const selectedSlot = useMemo(() => SLOTS.find((s) => s.label === timeSlot) || SLOTS[1], [timeSlot]);\n  const busySet = useMemo(() => new Set(busyMinutes), [busyMinutes]);\n  const isSlotBooked = (slot: Slot) => minutesForSlot(slot).some((minute) => busySet.has(minute));\n  const selectedBooked = isSlotBooked(selectedSlot);"
          new_block = "  const selectedPeriodConfig = useMemo(() => PERIODS.find((p) => p.key === selectedPeriod) || PERIODS[1], [selectedPeriod]);\n  const busySet = useMemo(() => new Set(busyMinutes), [busyMinutes]);\n  const selectedMinutes = useMemo(() => minutesForRange(startTime, endTime), [startTime, endTime]);\n  const selectedBooked = selectedMinutes.some((minute) => busySet.has(minute));\n  const timeSlot = `${selectedPeriodConfig.label} (${hourLabel(Number(startTime.slice(0, 2)))} - ${hourLabel(Number(endTime.slice(0, 2)) || 24)})`;\n  const startOptions = Array.from({ length: selectedPeriodConfig.end - selectedPeriodConfig.start }, (_, i) => selectedPeriodConfig.start + i);\n  const selectedStartHour = Number(startTime.slice(0, 2)) + (selectedPeriod === 'night' && Number(startTime.slice(0, 2)) < 6 ? 24 : 0);\n  const endOptions = Array.from({ length: selectedPeriodConfig.end - selectedStartHour }, (_, i) => selectedStartHour + i + 1);\n\n  const choosePeriod = (period: Period) => {\n    setSelectedPeriod(period.key);\n    setStartTime(hourToTime(period.start));\n    setEndTime(hourToTime(period.end));\n  };"
          if old_block not in s:
            raise SystemExit('Selected slot block not found')
          s = s.replace(old_block, new_block, 1)

          s = s.replace("date: bookingDate, timeSlot, startTime: selectedSlot.startTime, endTime: selectedSlot.endTime,", "date: bookingDate, timeSlot, startTime, endTime,")

          # Replace fixed slot buttons UI.
          ui_start = s.index('<div><label className="text-xs font-bold flex gap-1 mb-1"><Clock')
          ui_end = s.index('{isHall && hall &&', ui_start)
          new_ui = '''<div>
            <label className="text-xs font-bold flex gap-1 mb-2"><Clock className="w-4 h-4"/>الفترة {availabilityLoading && <span className="text-gray-400">(جاري الفحص...)</span>}</label>
            <div className="grid grid-cols-3 gap-2 mb-3">
              {PERIODS.map((period) => (
                <button key={period.key} type="button" disabled={availabilityLoading} onClick={() => choosePeriod(period)} className={`p-2.5 rounded-xl border text-xs font-bold ${selectedPeriod === period.key ? 'bg-emerald-700 text-white border-emerald-700' : 'bg-gray-50 text-gray-800'}`}>
                  {period.label}
                  <span className="block text-[9px] mt-0.5 opacity-80">{hourLabel(period.start)} - {hourLabel(period.end)}</span>
                </button>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold text-gray-600 block mb-1">من الساعة</label>
                <select value={startTime} onChange={(e) => { const next = e.target.value; setStartTime(next); const h = Number(next.slice(0,2)) + (selectedPeriod === 'night' && Number(next.slice(0,2)) < 6 ? 24 : 0); if (endOptions.length === 0 || minutesForRange(next, endTime).length === 0) setEndTime(hourToTime(h + 1)); }} className="w-full px-3 py-2.5 border rounded-xl text-xs bg-white">
                  {startOptions.map((h) => <option key={h} value={hourToTime(h)}>{hourLabel(h)}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold text-gray-600 block mb-1">إلى الساعة</label>
                <select value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full px-3 py-2.5 border rounded-xl text-xs bg-white">
                  {endOptions.map((h) => <option key={h} value={hourToTime(h)}>{hourLabel(h)}</option>)}
                </select>
              </div>
            </div>
            <div className={`mt-2 p-2 rounded-xl text-[10px] font-bold ${selectedBooked ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
              {selectedBooked ? 'الوقت المختار يتداخل مع حجز مؤكد. اختر وقتاً آخر.' : 'الوقت المختار متاح حالياً.'}
            </div>
          </div>
          '''
          s = s[:ui_start] + new_ui + s[ui_end:]

          old_phone = '<input value={customerPhone} onChange={(e)=>setCustomerPhone(e.target.value)} placeholder="07701234567" className="w-full px-3 py-2 border rounded-xl text-xs dir-ltr" required/>'
          new_phone = '<input type="tel" inputMode="numeric" maxLength={11} value={customerPhone} onChange={(e)=>setCustomerPhone(toEnglishDigits(e.target.value).replace(/\\D/g, \'\').slice(0, 11))} placeholder="07701234567" className="w-full px-3 py-2 border rounded-xl text-xs dir-ltr" required/>'
          if old_phone not in s:
            raise SystemExit('Booking phone input marker not found')
          s = s.replace(old_phone, new_phone, 1)

          # Better Firebase Phone Auth error messages.
          old_catch = "    } catch (err) { console.error('Booking failed:', err); setErrorMsg(err instanceof Error ? err.message : 'تعذر تنفيذ الحجز.'); }"
          new_catch = "    } catch (err: any) { console.error('Booking failed:', err); const code = err?.code || ''; const msg = code === 'auth/operation-not-allowed' ? 'تسجيل الدخول برقم الهاتف غير مفعّل في Firebase. فعّل Phone provider من Firebase Authentication.' : code === 'auth/invalid-app-credential' || code === 'auth/captcha-check-failed' ? 'فشل تحقق reCAPTCHA. تأكد أن localhost مضاف إلى Authorized domains في Firebase Authentication.' : code === 'auth/too-many-requests' ? 'تم إرسال محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.' : code === 'auth/invalid-phone-number' ? 'رقم الهاتف غير صحيح. اكتب 11 رقماً عراقياً يبدأ بـ 07.' : (err instanceof Error ? err.message : 'تعذر تنفيذ الحجز.'); setErrorMsg(msg); }"
          if old_catch not in s:
            raise SystemExit('Booking catch marker not found')
          s = s.replace(old_catch, new_catch, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthModal.tsx src/components/BookingModal.tsx
          git commit -m "Improve Iraqi phone input and booking time selection"
          git push origin HEAD:chatgpt-production-hardening
