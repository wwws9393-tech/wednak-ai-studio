name: One-time public availability fix

on:
  push:
    branches: [chatgpt-production-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time public availability fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-production-hardening

      - name: Use privacy-safe booking locks in public detail calendars
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              ('src/components/HallDetailsModal.tsx', 'hall'),
              ('src/components/ServiceProviderDetailsModal.tsx', 'provider'),
          ]

          for filename, kind in files:
              p = Path(filename)
              s = p.read_text()
              s = s.replace("import React, { useState } from 'react';", "import React, { useEffect, useMemo, useState } from 'react';", 1)
              if "from '../lib/firebase'" not in s:
                  marker = "import { Hall, UserProfile, Booking } from '../types';" if kind == 'hall' else "import { ServiceProvider, UserProfile, Booking } from '../types';"
                  s = s.replace(marker, marker + "\nimport { subscribeAvailability } from '../lib/firebase';", 1)

              state_marker = "  const [selectedCalendarDate, setSelectedCalendarDate] = useState(() => {\n    const today = new Date();\n    return today.toISOString().split('T')[0];\n  });"
              addition = state_marker + "\n  const [busyMinutes, setBusyMinutes] = useState<number[]>([]);\n\n  useEffect(() => {\n    const itemId = " + ("hall?.id" if kind == 'hall' else "provider?.id") + ";\n    if (!isOpen || !itemId || !selectedCalendarDate) {\n      setBusyMinutes([]);\n      return;\n    }\n    return subscribeAvailability(itemId, selectedCalendarDate, setBusyMinutes);\n  }, [isOpen, " + ("hall?.id" if kind == 'hall' else "provider?.id") + ", selectedCalendarDate]);\n\n  const busySet = useMemo(() => new Set(busyMinutes), [busyMinutes]);\n  const slotMinutes = (slot: string) => {\n    let start = 1080, end = 1380;\n    if (slot.includes('صباحي')) { start = 600; end = 840; }\n    else if (slot.includes('ليلي')) { start = 1380; end = 1560; }\n    const result: number[] = [];\n    for (let minute = start; minute < end; minute += 30) result.push(minute);\n    return result;\n  };\n  const slotIsBooked = (slot: string) => slotMinutes(slot).some((minute) => busySet.has(minute));"
              if state_marker not in s:
                  raise SystemExit(f'Missing calendar state marker in {filename}')
              s = s.replace(state_marker, addition, 1)

              if kind == 'hall':
                  old_block = "  // Get accepted bookings for this hall on the selected date\n  const acceptedBookingsForDate = bookings.filter(\n    (b) =>\n      b.itemId === hall.id &&\n      b.date === selectedCalendarDate &&\n      b.status === 'مقبول'\n  );\n"
              else:
                  old_block = "  const acceptedBookingsForDate = bookings.filter(\n    (b) =>\n      b.itemId === provider.id &&\n      b.date === selectedCalendarDate &&\n      b.status === 'مقبول'\n  );\n"
              if old_block in s:
                  s = s.replace(old_block, '', 1)
              s = s.replace("const isBooked = acceptedBookingsForDate.some((b) => b.timeSlot === slot);", "const isBooked = slotIsBooked(slot);")
              p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HallDetailsModal.tsx src/components/ServiceProviderDetailsModal.tsx
          git commit -m "Use privacy-safe public availability in detail calendars"
          git push origin HEAD:chatgpt-production-hardening
